<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Duet의 JEV 관제 흐름</title>
  <desc id="desc">작업 상태를 수집하고 작은 질문으로 나누어 JEV가 평가한다. 선택, 승인, 진행, 인계의 공통 confidence 기준은 기본 0.8이다. 적용 모드는 기준을 통과한 결과를 사용하며 승인 허용은 선택지 역순으로 재확인한다. 관찰 모드, 기준 미달, 오류는 기존 판단 경로를 유지한다. 권한 정책, 예산, 사용자 설계 질문과 검증 조건은 계속 적용한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#3d63dd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="fallback" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#8b95a5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; fill: #1d2330; }
      .muted { fill: #667085; }
      .accent { fill: #3d63dd; }
      .step { font-size: 14px; font-weight: 700; letter-spacing: 1.4px; }
      .heading { font-size: 24px; font-weight: 700; }
      .body { font-size: 18px; }
      .label { font-size: 16px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .card { fill: #fff; stroke: #dfe3e8; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="800" rx="18" fill="#f6f7f9"/>
  <text x="44" y="43" class="step accent">DUET / JEV CONTROL</text>
  <text x="44" y="87" font-size="32" font-weight="700">JEV가 다음 행동을 판단하는 흐름</text>
  <text x="44" y="116" class="body muted">필요한 상태만 읽고, 코드가 허용한 선택지 안에서 결정</text>
  <rect x="956" y="50" width="200" height="44" rx="22" fill="#eaf0ff"/>
  <text x="1056" y="78" text-anchor="middle" font-size="18" font-weight="700" class="accent">공통 기준 · 기본 0.8</text>

  <rect x="44" y="150" width="1112" height="52" rx="10" fill="#fff" stroke="#dfe3e8"/>
  <rect x="58" y="162" width="84" height="28" rx="6" fill="#eef1f5"/>
  <text x="100" y="182" text-anchor="middle" font-size="15" font-weight="700">항상 유지</text>
  <text x="160" y="183" class="body muted">권한 정책 · 읽기 전용 · 사용자 설계 질문 · 예산 한도 · 검증 조건</text>

  <!-- Evidence is collected locally. Only a bounded snapshot reaches the API. -->
  <rect x="44" y="244" width="260" height="218" rx="12" class="card"/>
  <text x="66" y="275" class="step muted">01 / STATE</text>
  <text x="66" y="312" class="heading">상태 수집</text>
  <path d="M66 331 H282" stroke="#e7eaf0"/>
  <text x="66" y="360" class="body">작업 범위와 요청</text>
  <text x="66" y="390" class="body">최근 턴 · 마지막 활동</text>
  <text x="66" y="425" class="label muted">반복·경과 시간은 코드로 계산</text>

  <path d="M309 352 H323" stroke="#3d63dd" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="328" y="244" width="260" height="218" rx="12" class="card"/>
  <text x="350" y="275" class="step accent">02 / JEV API</text>
  <text x="350" y="312" class="heading">질문을 나눠 평가</text>
  <path d="M350 331 H566" stroke="#e7eaf0"/>
  <text x="350" y="360" class="body">요청 범위 · 행동의 영향</text>
  <text x="350" y="390" class="body">진행 · 정체 · 인계</text>
  <text x="350" y="425" class="label muted">각 질문에 명확한 선택지 제공</text>

  <path d="M593 352 H607" stroke="#3d63dd" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="612" y="244" width="260" height="218" rx="12" fill="#fff" stroke="#3d63dd" stroke-width="1.5"/>
  <text x="634" y="275" class="step accent">03 / CONFIDENCE</text>
  <text x="634" y="312" class="heading">적용 여부 확인</text>
  <rect x="634" y="343" width="216" height="43" rx="8" fill="#eaf0ff"/>
  <text x="742" y="372" text-anchor="middle" class="mono accent" font-size="18" font-weight="700">confidence ≥ 0.8</text>
  <text x="634" y="415" class="body">승인 허용은 역순 재확인</text>
  <text x="634" y="443" class="label muted">선택·승인·진행·인계 공통</text>

  <path d="M877 352 H891" stroke="#3d63dd" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="896" y="244" width="260" height="218" rx="12" class="card"/>
  <text x="918" y="275" class="step muted">04 / DUET</text>
  <text x="918" y="312" class="heading">다음 행동 실행</text>
  <path d="M918 331 H1134" stroke="#e7eaf0"/>
  <text x="918" y="360" class="body">승인 · 턴 전환 · 인계</text>
  <text x="918" y="390" class="body">기존 검증 후 완료·병합</text>
  <text x="918" y="425" class="label muted">긴 대기는 확인 권고만 표시</text>

  <!-- off bypasses evaluation; shadow, abstention and errors use the existing path. -->
  <path d="M174 462 V539 H322" stroke="#8b95a5" stroke-width="1.8" stroke-dasharray="5 5" fill="none" marker-end="url(#fallback)"/>
  <text x="190" y="519" class="label muted mono">off</text>
  <path d="M742 462 V498" stroke="#8b95a5" stroke-width="1.8" fill="none" marker-end="url(#fallback)"/>
  <text x="763" y="488" class="label muted">관찰 · 기준 미달 · 오류</text>
  <rect x="328" y="504" width="544" height="78" rx="10" fill="#f0f2f5" stroke="#dfe3e8"/>
  <text x="600" y="535" text-anchor="middle" font-size="22" font-weight="700">기존 승인·선택·리뷰 경로</text>
  <text x="600" y="561" text-anchor="middle" class="label muted">설계자 검토와 필요한 사용자 판단으로 이어짐</text>

  <rect x="44" y="622" width="354" height="82" rx="10" class="card"/>
  <circle cx="66" cy="646" r="4" fill="#8b95a5"/>
  <text x="80" y="652" font-size="17" font-weight="700">OFF · 끔</text>
  <text x="64" y="682" class="body muted">API 호출 없이 기존 동작</text>

  <rect x="423" y="622" width="354" height="82" rx="10" class="card"/>
  <circle cx="445" cy="646" r="4" fill="#a86b00"/>
  <text x="459" y="652" font-size="17" font-weight="700">SHADOW · 관찰</text>
  <text x="443" y="682" class="body muted">판단 기록, 실행은 기존 경로</text>

  <rect x="802" y="622" width="354" height="82" rx="10" class="card"/>
  <circle cx="824" cy="646" r="4" fill="#3d63dd"/>
  <text x="838" y="652" font-size="17" font-weight="700">ON · 적용</text>
  <text x="822" y="682" class="body muted">기준 통과 시 흐름에 반영</text>

  <path d="M44 732 H1156" stroke="#dfe3e8"/>
  <text x="44" y="762" class="label muted">기록: 판단·적용 여부 · 호출 수 · 토큰 · 추정 비용</text>
  <text x="1156" y="762" text-anchor="end" class="label muted">JEV 추정 비용도 Duet 실행 예산에 합산</text>
</svg>
